name: Deploy AWS
on:
  workflow_dispatch:
    inputs:
      reuse_existing_images:
        description: Reuse both immutable images from this commit after a failed deployment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: study-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify-reusable.yml
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write non-secret deployment coordinates
        env:
          DEPLOY_CONFIG_JSON: ${{ vars.DEPLOY_CONFIG_JSON }}
        run: |
          mkdir -p .local/aws
          node -e 'const fs=require("fs");const c=JSON.parse(process.env.DEPLOY_CONFIG_JSON);fs.writeFileSync(".local/aws/deploy-config.json",JSON.stringify(c));'
      - name: Build and push immutable images
        if: ${{ !inputs.reuse_existing_images }}
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/aws/push-images.mjs
      - name: Release verified images
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/aws/deploy.mjs --confirm-aws-changes
